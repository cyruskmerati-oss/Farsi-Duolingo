name: Temporary generated index rebuild
on:
  push:
    branches:
      - codex/rebuild-generated-index
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/rebuild-generated-index
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and deploy generated site file
        run: |
          cd source
          npm install
          npm run deploy
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/temporary-rebuild.yml
          git commit -m "Rebuild generated site without moving birds"
          git push origin codex/rebuild-generated-index
